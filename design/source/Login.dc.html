        <x-import component-from-global-scope="ShadcnUI.SelectValue" placeholder="Sprache"></x-import>
      </x-import>
      <x-import component-from-global-scope="ShadcnUI.SelectContent">
        <x-import component-from-global-scope="ShadcnUI.SelectItem" value="de">Deutsch</x-import>
        <x-import component-from-global-scope="ShadcnUI.SelectItem" value="fr">Français</x-import>
        <x-import component-from-global-scope="ShadcnUI.SelectItem" value="it">Italiano</x-import>

    <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--radius-xl); background: var(--primary); color: var(--primary-foreground); font-weight: 800; font-size: 32px">K</span>
    <h1 style="margin: 0; font-size: 36px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em">Kyandō</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px">Der Lagerplan für dein Coach-Team.</p>
  </div>

  <x-import component-from-global-scope="ShadcnUI.Card">
    <x-import component-from-global-scope="ShadcnUI.CardHeader">
      <x-import component-from-global-scope="ShadcnUI.CardTitle">Anmelden</x-import>
      <x-import component-from-global-scope="ShadcnUI.CardDescription">Melde dich mit deiner E-Mail-Adresse an.</x-import>
    </x-import>
    <x-import component-from-global-scope="ShadcnUI.CardContent">
      <form style="margin: 0">
        <x-import component-from-global-scope="ShadcnUI.FieldGroup">
          <x-import component-from-global-scope="ShadcnUI.Field">
            <x-import component-from-global-scope="ShadcnUI.FieldLabel" html-for="email">E-Mail</x-import>
            <x-import component-from-global-scope="ShadcnUI.Input" id="email" type="email" autocomplete="email" inputmode="email" placeholder="name@beispiel.ch" style="height: 44px; font-size: 16px"></x-import>
          </x-import>
          <x-import component-from-global-scope="ShadcnUI.Field">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <x-import component-from-global-scope="ShadcnUI.FieldLabel" html-for="password">Passwort</x-import>
              <a href="#" style="font-size: 14px; line-height: 20px; font-weight: 500; text-decoration: underline; text-underline-offset: 4px">Passwort vergessen?</a>
            </div>
            <x-import component-from-global-scope="ShadcnUI.Input" id="password" type="password" autocomplete="current-password" style="height: 44px; font-size: 16px"></x-import>

          <x-import component-from-global-scope="ShadcnUI.Button" type="submit" size="lg" style="width: 100%; height: 44px">Anmelden</x-import>

  </x-import>

  <p style="margin: auto 0 0; text-align: center; font-size: 14px; line-height: 20px">Noch keinen Zugang? Wende dich an die Lagerleitung.</p>
